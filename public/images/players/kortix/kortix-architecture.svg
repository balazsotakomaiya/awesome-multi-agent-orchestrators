<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1400 900"><title id="title">Kortix CompanyOS sessions, change requests, and where self-hosting runs</title><desc id="desc">A diagram of Kortix: My Kortix and triggers start agent sessions on their own cloud computers, state stays in the repo, Drive, workspace and session record, and a workspace change opens a change request.</desc><style>.serif{font-family:Georgia,&quot;Times New Roman&quot;,serif;fill:#1d1712}.body{font-family:Outfit,&quot;Segoe UI&quot;,sans-serif;fill:#5e554d}.label{font-family:&quot;IBM Plex Mono&quot;,ui-monospace,monospace;letter-spacing:.08em;fill:#1a6e67}.title{font-size:40px}.node{font-size:26px;font-weight:700;fill:#1d1712}.small{font-size:18px}.card{fill:#fffaf2;stroke:#1d1712;stroke-opacity:.18}.teal{fill:#e7f3f1;stroke:#1a6e67}.amber{fill:#fbf1e4;stroke:#c56a2d}</style><rect width="1400" height="900" fill="#f8f2e7"/><text x="64" y="64" class="label" font-size="16">KORTIX COMPANYOS</text><text x="64" y="112" class="serif title">One repo, then a session on its own computer</text><text x="64" y="150" class="body" font-size="20">Agents, skills, memory and connectors are files in a git repository the company owns.</text><g><rect width="300" height="130" x="64" y="190" class="card" rx="22"/><text x="88" y="228" class="label" font-size="14">YOU</text><text x="88" y="266" class="node">My Kortix</text><text x="88" y="296" class="body small">Answers, then hands work off</text></g><g><rect width="340" height="130" x="388" y="190" class="card" rx="22"/><text x="412" y="228" class="label" font-size="14">TRIGGERS</text><text x="412" y="266" class="node">Events start agents</text><text x="412" y="296" class="body small">Schedules, webhooks, app events</text></g><g><rect width="584" height="130" x="752" y="190" class="card teal" rx="22"/><text x="776" y="228" class="label" font-size="14">SESSION</text><text x="776" y="266" class="node">Its own cloud computer</text><text x="776" y="296" class="body small">Terminal, browser, desktop. Sleeps after the last turn.</text></g><g><rect width="620" height="180" x="64" y="360" class="card" rx="22"/><text x="88" y="400" class="label" font-size="14">STATE THAT STAYS</text><text x="88" y="442" class="node">Repo, Drive, /workspace</text><text x="88" y="478" class="body small">Drive files are stored on Platinum.</text><text x="88" y="506" class="body small">The session record keeps the history.</text></g><g><rect width="620" height="180" x="716" y="360" class="card amber" rx="22"/><text x="740" y="400" class="label" font-size="14">CHANGE REQUEST</text><text x="740" y="442" class="node">Review, then Ship it</text><text x="740" y="478" class="body small">worker may merge its own request when asked.</text><text x="740" y="506" class="body small">Remove that permission to require a person.</text></g><g><rect width="420" height="250" x="64" y="580" class="card" rx="22"/><text x="88" y="624" class="label" font-size="14">CONNECTORS</text><text x="88" y="668" class="node">Allow, Ask, Block</text><text x="88" y="706" class="body small">The README says 3,000+ apps,</text><text x="88" y="732" class="body small">plus MCP, OpenAPI and HTTP.</text><text x="88" y="768" class="body small">Credentials stay on the server.</text></g><g><rect width="820" height="250" x="516" y="580" class="card teal" rx="22"/><text x="540" y="624" class="label" font-size="14">SELF-HOST</text><text x="540" y="668" class="node">App and API on your server</text><text x="540" y="706" class="body small">The Compose stack holds the web app, API, database and gateway.</text><text x="540" y="734" class="body small">Every session still runs in a Platinum sandbox.</text><text x="540" y="762" class="body small">The server must be reachable so the sandbox can call back.</text><text x="540" y="790" class="body small">A self-hosted instance has no Kortix-managed models.</text></g></svg>